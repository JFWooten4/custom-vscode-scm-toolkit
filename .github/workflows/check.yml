name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compile Python
        run: python3 -m py_compile install.py ai_commit.py model_picker.py tests/test_install.py tests/test_ai_commit.py tests/test_model_picker.py

      - name: Run installer tests
        run: python3 -m unittest discover -s tests -v

      - name: Check injected JavaScript syntax
        run: node --check picker.js
