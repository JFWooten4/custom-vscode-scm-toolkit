name: Rebuild merged installer

on:
  push:
    branches:
      - quiet-pr-cleanup

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: macos-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Rebuild signed installer
        run: python3 scripts/build_installer_app.py

      - name: Commit rebuilt installer and remove temporary workflow
        run: |
          rm .github/workflows/rebuild-installer-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Expected rebuilt installer changes were not produced." >&2
            exit 1
          fi
          git commit -m "🛠️ Rebuild merged installer" -m "Rebuilds the signed macOS installer after reconciling the open PRs." -m "Co-authored-by: Codex Web <noreply@openai.com>"
          git push origin HEAD:quiet-pr-cleanup
